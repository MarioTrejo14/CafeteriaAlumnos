<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAFETERÍA UdeC - Panel de Cafetería</title>
    <!-- Favicon institucional UdeC -->
    <link rel="icon" type="image/png" href="https://upload.wikimedia.org/wikipedia/commons/4/44/Universidad_de_Colima.png">
    <link rel="stylesheet" href="style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .admin-header-flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 1rem;
            background: white;
            padding: 1.25rem;
            border-radius: var(--border-radius);
            border: 1px solid #eaeaea;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .status-badge-0 { background: #fef3c7; color: #d97706; }
        .status-badge-1 { background: #e0f2fe; color: #0284c7; }
        .status-badge-2 { background: #dcfce7; color: #16a34a; }
        .status-badge-3 { background: #f1f5f9; color: #64748b; }

        .order-status-pill {
            font-size: 0.75rem;
            font-weight: 700;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            display: inline-block;
        }

        .admin-card-actions {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.5rem;
            margin-top: 1rem;
        }

        .admin-card-actions button {
            font-size: 0.75rem;
            padding: 0.5rem;
            border-radius: 8px;
            background: #f8fafc;
            color: var(--text-muted);
            border: 1px solid #ddd;
            cursor: pointer;
            font-weight: 600;
        }

        .admin-card-actions button.active {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }
    </style>
</head>
<body>
    <header class="app-header" style="background-color: #333;">
        <div class="header-content">
            <img src="https://upload.wikimedia.org/wikipedia/commons/4/44/Universidad_de_Colima.png" alt="Universidad de Colima" class="header-logo">
            <div class="header-text">
                <h1>PANEL DE CAFETERÍA</h1>
                <h2>Gestión de Pedidos y Stock</h2>
                <span class="academic-badge">Personal Autorizado</span>
            </div>
        </div>
    </header>

    <main id="app-container">
        <!-- VISTA: PANEL DE PEDIDOS -->
        <section id="view-admin" class="view active">
            <div class="admin-header-flex">
                <div>
                    <h2 style="font-size: 1.1rem; font-weight: 700;">Órdenes en Tiempo Real</h2>
                    <p style="font-size: 0.8rem; color: var(--text-muted);">Sincronizado con Firebase</p>
                </div>
                <div style="display: flex; gap: 0.5rem;">
                    <button id="btnFilterAll" class="cat-btn active" style="padding: 0.4rem 1rem;">Todos</button>
                    <button id="btnFilterPending" class="cat-btn" style="padding: 0.4rem 1rem;">Pendientes</button>
                </div>
            </div>
            <div id="adminOrdersContainer" class="admin-orders-grid">
                <p style="text-align:center; padding: 2rem; color: var(--text-muted);">Cargando pedidos...</p>
            </div>
        </section>

        <!-- VISTA: ESCÁNER QR -->
        <section id="view-scanner" class="view">
            <div class="scanner-container" style="max-width: 600px; margin: 0 auto; text-align: center; background: white; padding: 2rem; border-radius: var(--border-radius); box-shadow: 0 2px 8px rgba(0,0,0,0.05);">
                <h2>Escáner de Credencial</h2>
                <div class="scanner-box" style="height: 180px; margin: 1rem 0;">
                    <i class="fas fa-qrcode"></i>
                    <p>Apunta al código QR de la credencial UdeC</p>
                </div>
                <button id="btnSimulateScan" class="btn-primary">Simular Escaneo (Buscar siguiente orden lista)</button>
                <div id="scanResult" class="scan-result hidden" style="text-align: left; margin-top: 1.5rem;"></div>
            </div>
        </section>

        <!-- VISTA: INVENTARIO / CONTROL DE STOCK -->
        <section id="view-inventory" class="view">
            <div class="admin-header-flex">
                <div>
                    <h2 style="font-size: 1.1rem; font-weight: 700;">Control de Disponibilidad</h2>
                    <p style="font-size: 0.8rem; color: var(--text-muted);">Activa o agota platillos al instante</p>
                </div>
            </div>
            <div id="adminInventoryContainer" class="products-grid"></div>
        </section>
    </main>

    <!-- NAVEGACIÓN INFERIOR ADMIN -->
    <nav class="bottom-nav">
        <button class="nav-btn active" data-target="view-admin">
            <i class="fas fa-clipboard-list"></i><span>Pedidos</span>
        </button>
        <button class="nav-btn" data-target="view-scanner">
            <i class="fas fa-qrcode"></i><span>Escáner</span>
        </button>
        <button class="nav-btn" data-target="view-inventory">
            <i class="fas fa-boxes"></i><span>Inventario</span>
        </button>
    </nav>

    <!-- Script de Admin -->
    <script type="module" src="admin.js"></script>
</body>
</html>
