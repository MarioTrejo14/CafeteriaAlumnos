<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAFETERÍA UdeC - Panel Administrativo</title>
    <link rel="stylesheet" href="style.css?v=2026">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <header class="app-header">
        <div class="header-content">
            <h1>🛠️ PANEL DE CAFETERÍA</h1>
            <h2>Administración y Pedidos</h2>
            <span class="academic-badge">Control Institucional</span>
        </div>
    </header>

    <main id="app-container">
        <!-- VISTA 1: GESTIÓN DE PEDIDOS -->
        <div id="view-admin-orders" class="view active">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 1rem;">
                <h2>Pedidos en Tiempo Real</h2>
                <div style="display: flex; gap: 0.5rem;">
                    <button id="btnFilterAll" class="cat-btn active" style="padding: 0.4rem 1rem; border-radius: 8px;">Todos</button>
                    <button id="btnFilterPending" class="cat-btn" style="padding: 0.4rem 1rem; border-radius: 8px;">Pendientes</button>
                </div>
            </div>

            <div id="adminOrdersContainer" class="products-grid"></div>
        </div>

        <!-- VISTA 2: SIMULADOR DE ESCÁNER / ENTREGA -->
        <div id="view-scanner" class="view">
            <div class="success-screen" style="max-width: 600px; margin: 0 auto; text-align: center;">
                <h2>Simulador de Escáner QR</h2>
                <p style="color: var(--text-muted); margin-bottom: 1.5rem;">Simula la lectura del código del alumno para entregar pedidos listos.</p>
                <button id="btnSimulateScan" class="btn-primary" style="max-width: 250px; margin: 0 auto 1.5rem auto;">Escanear Siguiente Orden</button>
                <div id="scanResult" class="hidden" style="background: var(--bg-color); padding: 1.5rem; border-radius: 10px; border: 1px solid var(--border); text-align: left;"></div>
            </div>
        </div>
    </main>

    <nav class="bottom-nav">
        <button class="nav-btn active" data-target="view-admin-orders">
            <i class="fas fa-clipboard-list"></i><span>Pedidos</span>
        </button>
        <button class="nav-btn" data-target="view-scanner">
            <i class="fas fa-qrcode"></i><span>Escáner</span>
        </button>
    </nav>

    <script type="module" src="admin.js?v=2026"></script>
</body>
</html>
