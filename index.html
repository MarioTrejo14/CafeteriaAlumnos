<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAFETERÍA UdeC - Menú Digital</title>
    <!-- Favicon institucional UdeC -->
    <link rel="icon" type="image/png" href="https://upload.wikimedia.org/wikipedia/commons/4/44/Universidad_de_Colima.png">
    <link rel="stylesheet" href="style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <header class="app-header">
        <div class="header-content">
            <img src="https://upload.wikimedia.org/wikipedia/commons/4/44/Universidad_de_Colima.png" alt="Universidad de Colima" class="header-logo">
            <div class="header-text">
                <h1>CAFETERÍA UdeC</h1>
                <h2>Menú digital</h2>
                <span class="academic-badge">Prototipo académico — Universidad de Colima</span>
            </div>
        </div>
    </header>

    <main id="app-container">
        <!-- VISTA: MENÚ PRINCIPAL -->
        <section id="view-menu" class="view active">
            <div class="search-bar">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="Buscar productos...">
            </div>
            
            <div class="categories-scroll" id="categoriesContainer">
                <!-- Se llena con JS -->
            </div>

            <div class="products-grid" id="productsContainer">
                <!-- Se llena con JS -->
            </div>
        </section>

        <!-- VISTA: CARRITO -->
        <section id="view-cart" class="view">
            <h2>Tu Pedido</h2>
            <div id="cartItems" class="cart-items">
                <!-- Items del carrito -->
            </div>
            <div class="cart-summary">
                <div class="total-row">
                    <span>Total:</span>
                    <span id="cartTotal">$0.00</span>
                </div>
                
                <div class="checkout-form">
                    <label for="studentId">Número de cuenta del alumno:</label>
                    <input type="number" id="studentId" placeholder="Ej. 20123456" required>
                    <small>*Solo para identificación del pedido. Prototipo académico.</small>
                    
                    <button id="btnConfirmOrder" class="btn-primary" disabled>
                        Confirmar Pedido
                    </button>
                    <button id="btnEmptyCart" class="btn-danger">Vaciar Carrito</button>
                </div>
            </div>
        </section>

        <!-- VISTA: RASTREO DE PEDIDO (ESTILO MERCADO LIBRE) -->
        <section id="view-tracking" class="view">
            <div class="success-screen">
                <i class="fas fa-check-circle success-icon"></i>
                <h2>PEDIDO REALIZADO</h2>
                <h1 id="trackOrderNumber">ORDEN #---</h1>
                
                <div class="ml-progress-wrapper">
                    <div id="trackStatusTitle" style="font-weight: 700; color: var(--primary-color); margin-bottom: 0.5rem; font-size: 1.1rem;">Estado: Recibido</div>
                    
                    <div class="ml-progress-bar-container">
                        <div class="ml-progress-fill" id="mlProgressFill"></div>
                    </div>

                    <div class="ml-steps-labels">
                        <div class="ml-step-item" id="ml-step-0">
                            <div class="ml-step-dot"><i class="fas fa-receipt"></i></div>
                            <div class="ml-step-text">Recibido</div>
                        </div>
                        <div class="ml-step-item" id="ml-step-1">
                            <div class="ml-step-dot"><i class="fas fa-fire"></i></div>
                            <div class="ml-step-text">Preparando</div>
                        </div>
                        <div class="ml-step-item" id="ml-step-2">
                            <div class="ml-step-dot"><i class="fas fa-check"></i></div>
                            <div class="ml-step-text">Listo</div>
                        </div>
                        <div class="ml-step-item" id="ml-step-3">
                            <div class="ml-step-dot"><i class="fas fa-box-open"></i></div>
                            <div class="ml-step-text">Entregado</div>
                        </div>
                    </div>
                </div>

                <div class="order-details-card">
                    <h3>Resumen:</h3>
                    <ul id="trackOrderItems"></ul>
                    <h3 class="track-total">Total: <span id="trackOrderTotal"></span></h3>
                </div>
            </div>
        </section>
    </main>

    <!-- NAVEGACIÓN INFERIOR ALUMNO -->
    <nav class="bottom-nav">
        <button class="nav-btn active" data-target="view-menu">
            <i class="fas fa-utensils"></i>
            <span>Menú</span>
        </button>
        <button class="nav-btn" data-target="view-cart">
            <i class="fas fa-shopping-cart"></i>
            <span>Carrito</span>
            <span id="cartBadge" class="badge hidden">0</span>
        </button>
        <button class="nav-btn" data-target="view-tracking">
            <i class="fas fa-receipt"></i>
            <span>Mi Orden</span>
        </button>
    </nav>

    <!-- Script de Alumno -->
    <script type="module" src="alumno.js"></script>
</body>
</html>
